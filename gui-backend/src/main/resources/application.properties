# Servidor local y sesión de la API.
server.address=${GUI_BIND_ADDRESS:127.0.0.1}
server.port=${GUI_API_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${GUI_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=strict
spring.application.name=gui-api

# SQL Server: las credenciales llegan del proceso o del contenedor, nunca del frontend.
spring.datasource.url=${GUI_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GUI_BP;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${GUI_DB_USER:gui_app}
spring.datasource.password=${GUI_DB_PASSWORD:}
spring.datasource.hikari.pool-name=GUI-Pool
spring.datasource.hikari.maximum-pool-size=${GUI_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${GUI_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${GUI_DB_CONNECTION_TIMEOUT:15000}
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

gui.bootstrap.username=${GUI_BOOTSTRAP_USERNAME:}
gui.bootstrap.password=${GUI_BOOTSTRAP_PASSWORD:}

# Recuperación por correo. Deshabilitada hasta autorizar el remitente.
spring.mail.host=${GUI_MAIL_HOST:}
spring.mail.port=${GUI_MAIL_PORT:587}
spring.mail.username=${GUI_MAIL_USERNAME:}
spring.mail.password=${GUI_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
gui.mail.enabled=${GUI_MAIL_ENABLED:false}
gui.mail.from=${GUI_MAIL_FROM:}
gui.recovery.secret=${GUI_RESET_SECRET:}

# Validar también el nombre del servidor SMTP; STARTTLS por sí solo no lo garantiza.
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# SQL Server 2014 usa compatibilidad TLS local; no extenderla al correo de Internet.
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.debug=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
